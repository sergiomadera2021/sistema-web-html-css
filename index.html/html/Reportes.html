<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Ferretería Maxi</title>
  <link rel="stylesheet" href="css/EstiloFerreteria.css">
</head>
<body>
  <header>
    <h1>Reportes del Sistema</h1>
    <a href="MenuPrincipal.html" class="volver">← Volver</a>
  </header>

  <main>
    <section class="reportes">
      <h2>Generar reportes</h2>
      <div class="botones-reportes">
        <button>Reporte de stock bajo</button>
        <button>Reporte de ventas diarias</button>
        <button>Reporte de productos más vendidos</button>
        <button>Reporte de compras por proveedor</button>
      </div>
    </section>

    <section class="tabla-reporte">
      <h3>Ejemplo de reporte generado</h3>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Precio</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Martillo</td>
            <td>Herramientas</td>
            <td>4</td>
            <td>$1.200</td>
          </tr>
          <tr>
            <td>Destornillador</td>
            <td>Herramientas</td>
            <td>2</td>
            <td>$800</td>
          </tr>
          <tr>
            <td>Pintura blanca</td>
            <td>Pinturas</td>
            <td>1</td>
            <td>$3.500</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
