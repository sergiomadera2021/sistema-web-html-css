<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos - Ferretería Maxi</title>
  <link rel="stylesheet" href="css/EstiloFerreteria.css">
</head>
<body>
  <header><h1>Gestión de Productos</h1><a href="MenuPrincipal.html" class="volver">← Volver</a></header>
  <main>
    <form class="formulario">
      <input type="text" placeholder="Código">
      <input type="text" placeholder="Nombre">
      <input type="text" placeholder="Categoría">
      <input type="number" placeholder="Precio">
      <input type="number" placeholder="Stock inicial">
      <input type="number" placeholder="Stock mínimo">
      <button>Registrar producto</button>
    </form>
    <table>
      <thead>
        <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr>
      </thead>
      <tbody>
        <tr><td>001</td><td>Martillo</td><td>Herramientas</td><td>$1200</td><td>25</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
