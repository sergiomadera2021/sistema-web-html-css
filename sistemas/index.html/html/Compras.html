<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Compras - Ferretería Maxi</title>
  <link rel="stylesheet" href="css/EstiloFerreteria.css">
</head>
<body>
  <header><h1>Registro de Compras</h1><a href="MenuPrincipal.html" class="volver">← Volver</a></header>
  <main>
    <form class="formulario">
      <input type="text" placeholder="Proveedor">
      <input type="text" placeholder="Código del producto">
      <input type="number" placeholder="Cantidad">
      <input type="number" placeholder="Precio">
      <button>Registrar compra</button>
    </form>
    <table>
      <thead><tr><th>Proveedor</th><th>Producto</th><th>Cantidad</th><th>Precio</th></tr></thead>
      <tbody><tr><td>ABC S.A.</td><td>Clavos</td><td>100</td><td>$3000</td></tr></tbody>
    </table>
  </main>
</body>
